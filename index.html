<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <!-- Viewport dinamis khusus HP agar tidak zoom-out otomatis dan mendukung notch/safe-area -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Digitas5</title>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh; /* Dynamic viewport height untuk browser HP (Chrome/Safari) */
            overflow: hidden;
            background-color: #ffffff;
            position: fixed; /* Mencegah pull-to-refresh / bouncing effect di HP */
        }

        .iframe-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            overflow: hidden;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <div class="iframe-container">
        <!-- GANTI URL_GAS_ANDA DENGAN LINK WEB APP GAS ANDA -->
        <iframe 
            src="https://script.google.com/macros/s/AKfycby0zaBn7pyAW6Aa8VZm9F0vYftI5bB-SxXZdo67k0zYEDXSvpRdCJS-ViQxb-TrhJFZgg/exec" 
            allow="fullscreen; camera; microphone; geolocation"
            sandbox="allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts allow-downloads"
            title="Aplikasi Digitas">
        </iframe>
    </div>

</body>
</html>
